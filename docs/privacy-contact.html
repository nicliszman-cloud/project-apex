<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contato de Privacidade — StreetClub</title>
<style>
:root{color-scheme:dark;--bg:#050506;--card:#101114;--text:#f7f7f8;--muted:#a3a6ad;--red:#e50914;--border:#292b31}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 Inter,system-ui,sans-serif}
main{max-width:700px;margin:auto;padding:42px 18px 70px}.brand{font-size:28px;font-weight:900;font-style:italic}.brand b{color:var(--red)}
.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:22px;margin-top:22px}h1{font-size:30px}p{color:var(--muted)}
label{display:block;font-size:13px;font-weight:800;margin:14px 0 6px}input,select,textarea{width:100%;background:#141519;color:white;border:1px solid #33363d;border-radius:12px;padding:13px;font:inherit}
button{width:100%;background:var(--red);color:white;border:0;border-radius:12px;padding:14px;margin-top:16px;font-weight:900;font-size:15px}
.status{margin-top:14px;padding:12px;border-radius:10px;display:none}.ok{display:block;background:#0d2415;color:#9ee7b3}.err{display:block;background:#2a0c0f;color:#ff9da3}a{color:#ff4a53}
</style></head><body><main>
<div class="brand">Street<b>Club</b></div>
<form id="form" class="card"><h1>Contato de privacidade</h1>
<p>Use este formulário para dúvidas sobre dados, solicitações de acesso ou suporte relacionado à exclusão da conta.</p>
<label for="email">E-mail</label><input id="email" type="email" required>
<label for="type">Assunto</label><select id="type"><option value="privacy_question">Dúvida de privacidade</option><option value="data_request">Solicitação sobre meus dados</option><option value="account_deletion_help">Ajuda para excluir conta</option><option value="other">Outro</option></select>
<label for="message">Mensagem</label><textarea id="message" rows="6" maxlength="4000" required></textarea>
<input id="website" type="text" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px">
<button type="submit">Enviar solicitação</button><div id="status" class="status"></div></form>
<p><a href="https://qbfkietvmhgzgztjxxdw.supabase.co/functions/v1/privacy-policy">Política de Privacidade</a> · <a href="https://qbfkietvmhgzgztjxxdw.supabase.co/functions/v1/account-deletion">Excluir conta</a></p>
<script>
const URL='https://qbfkietvmhgzgztjxxdw.supabase.co';
const KEY='sb_publishable_LWaHEgpVt0B_rBbBOKyWmw_7iwSS0Yf';
function status(msg,ok){const el=document.getElementById('status');el.textContent=msg;el.className='status '+(ok?'ok':'err')}
document.getElementById('form').addEventListener('submit',async(e)=>{
 e.preventDefault();
 const body={email:document.getElementById('email').value.trim(),request_type:document.getElementById('type').value,message:document.getElementById('message').value.trim(),website:document.getElementById('website').value};
 const res=await fetch(URL+'/functions/v1/privacy-request',{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify(body)});
 if(!res.ok){status('Não foi possível enviar agora. Tente novamente mais tarde.',false);return}
 e.target.reset();status('Solicitação registrada com sucesso.',true);
});
</script></main></body></html>
